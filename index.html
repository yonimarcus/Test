<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>To-Do List</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="empty-message">No tasks yet — add one above!</p>
    <button id="clear-completed" type="button">Clear completed</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
